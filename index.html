<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<script>
  // 強制清除快取（每次開啟都重新載入）
  (function() {
    const key = '_v';
    const now = Date.now().toString(); // 完整毫秒時間戳，每次都不同
    const url = new URL(window.location.href);
    if (url.searchParams.get(key) !== now.slice(0, 10)) {
      url.searchParams.set(key, now.slice(0, 10));
      window.location.replace(url.toString());
    }
  })();
</script>
<title>業務下單系統 — FlyLight Travel Lab</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap');
* { margin:0; padding:0; box-sizing:border-box; }
html { overflow-x: hidden; }

:root {
  --brown: #c87830;
  --dark-brown: #7a4a18;
  --light-brown: #e8c898;
  --cream: #fdf8f0;
  --bg: #ede5d8;
  --text: #3a2008;
  --subtext: #9a6030;
  --border: #e8d8c0;
  --success: #5a8a40;
  --error: #c84030;
  --hotel: #3878c8;
  --hotel-dark: #1a4a90;
  --hotel-light: #c8dff8;
  --hotel-bg: #eef5ff;
}

body { font-family: 'Noto Sans TC', sans-serif; background: var(--bg); min-height: 100vh; padding: 0 0 80px; }

/* ── 登入頁 ── */
.login-page { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
.login-card { background: var(--cream); border-radius: 20px; padding: 36px 28px; width: 100%; max-width: 360px; box-shadow: 0 20px 60px rgba(120,80,30,0.15); }
.login-logo { text-align: center; margin-bottom: 24px; }
.login-logo-icon { font-size: 48px; margin-bottom: 8px; }
.login-logo-name { font-size: 16px; font-weight: 900; color: var(--dark-brown); letter-spacing: 1px; }
.login-logo-sub { font-size: 11px; color: var(--subtext); margin-top: 2px; }
.login-title { font-size: 14px; font-weight: 800; color: var(--dark-brown); margin-bottom: 20px; text-align: center; }
.login-field { margin-bottom: 16px; }
.login-label { font-size: 11px; font-weight: 700; color: var(--subtext); letter-spacing: 1px; margin-bottom: 6px; display: block; }
.login-input { width: 100%; height: 46px; border: 1.5px solid var(--border); border-radius: 12px; background: #fff8ee; padding: 0 16px; font-size: 16px; color: var(--text); font-family: 'Noto Sans TC', sans-serif; outline: none; }
.login-input:focus { border-color: var(--brown); }
.login-btn { width: 100%; height: 48px; background: var(--brown); color: #fff8ee; border: none; border-radius: 12px; font-size: 15px; font-weight: 800; cursor: pointer; font-family: 'Noto Sans TC', sans-serif; letter-spacing: 1px; margin-top: 8px; }
.login-error { color: var(--error); font-size: 12px; text-align: center; margin-top: 10px; display: none; }

/* ── Top Bar ── */
.main-page { display: none; }
.top-bar { background: var(--brown); padding: 14px 20px; display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 100; box-shadow: 0 2px 12px rgba(100,50,0,0.2); }
.top-bar-brand { color: #fff8ee; font-size: 14px; font-weight: 900; }
.top-bar-agent { color: rgba(255,248,238,0.7); font-size: 11px; margin-top: 2px; }
.top-bar-right { display: flex; align-items: center; gap: 10px; }
.logout-btn { background: rgba(255,255,255,0.15); border: 1px solid rgba(255,255,255,0.3); color: #fff8ee; font-size: 12px; font-weight: 700; padding: 6px 14px; border-radius: 20px; cursor: pointer; font-family: 'Noto Sans TC', sans-serif; }

/* ── Tabs ── */
.tabs { background: var(--cream); border-bottom: 1px solid var(--border); display: flex; padding: 0 20px; overflow-x: auto; }
.tab { padding: 14px 16px; font-size: 13px; font-weight: 700; color: var(--subtext); cursor: pointer; border-bottom: 2.5px solid transparent; white-space: nowrap; }
.tab.active { color: var(--brown); border-bottom-color: var(--brown); }

.content { padding: 16px 20px; max-width: 640px; margin: 0 auto; }

/* ── Card ── */
.card { background: var(--cream); border-radius: 16px; padding: 18px; margin-bottom: 14px; border: 1.5px solid var(--light-brown); }
.card-title { font-size: 13px; font-weight: 800; color: var(--dark-brown); letter-spacing: 1px; margin-bottom: 14px; padding-bottom: 10px; border-bottom: 2px solid var(--border); display: flex; align-items: center; gap: 8px; }

/* ── 方案卡片 ── */
.plan-grid { display: flex; flex-direction: column; gap: 10px; }
.plan-card { background: #fff8ee; border: 1.5px solid var(--light-brown); border-radius: 12px; padding: 14px 16px; display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.plan-left { flex: 1; }
.plan-id { font-size: 10px; font-weight: 700; color: var(--subtext); letter-spacing: 1px; margin-bottom: 3px; }
.plan-name { font-size: 13px; font-weight: 800; color: var(--text); margin-bottom: 3px; }
.plan-desc { font-size: 11px; color: var(--subtext); }
.plan-stock { font-size: 13px; font-weight: 700; margin-top: 4px; }
.plan-stock.low { color: #c84030; }
.plan-stock.ok { color: #5a8a40; }
.plan-stock.sold-out { color: #c84030; }
.add-cart-btn:disabled { background: #ccc; color: #888; cursor: not-allowed; opacity: 0.7; }
.plan-price { font-size: 16px; font-weight: 900; color: var(--brown); white-space: nowrap; }
.add-cart-btn { background: var(--brown); color: #fff; border: none; border-radius: 8px; padding: 8px 14px; font-size: 13px; font-weight: 700; cursor: pointer; font-family: 'Noto Sans TC', sans-serif; white-space: nowrap; flex-shrink: 0; }
.add-cart-btn:active { background: var(--dark-brown); }

/* ── 飯店方案卡片 ── */
.hotel-plan-card { background: var(--hotel-bg); border: 1.5px solid var(--hotel-light); border-radius: 12px; padding: 14px 16px; display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.hotel-plan-id { font-size: 10px; font-weight: 700; color: var(--hotel); letter-spacing: 1px; margin-bottom: 3px; }
.hotel-plan-name { font-size: 13px; font-weight: 800; color: var(--text); margin-bottom: 3px; }
.hotel-plan-desc { font-size: 11px; color: #5070a0; }
.hotel-plan-price { font-size: 14px; font-weight: 900; color: var(--hotel); white-space: nowrap; text-align: right; }
.hotel-plan-price-sub { font-size: 10px; color: #7090c0; }
.add-hotel-btn { background: var(--hotel); color: #fff; border: none; border-radius: 8px; padding: 8px 14px; font-size: 13px; font-weight: 700; cursor: pointer; font-family: 'Noto Sans TC', sans-serif; white-space: nowrap; flex-shrink: 0; }
.add-hotel-btn:active { background: var(--hotel-dark); }

/* ── 購物車 ── */
.cart-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 150; }
.cart-overlay.show { display: block; }
.cart-panel { position: fixed; bottom: 0; left: 0; right: 0; background: var(--cream); border-radius: 20px 20px 0 0; padding: 20px; max-height: 80vh; overflow-y: auto; z-index: 160; transform: translateY(100%); transition: transform 0.3s ease; }
.cart-panel.show { transform: translateY(0); }
.cart-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; padding-bottom: 12px; border-bottom: 2px solid var(--border); }
.cart-title { font-size: 16px; font-weight: 900; color: var(--dark-brown); }
.cart-close { background: none; border: none; font-size: 20px; cursor: pointer; color: var(--subtext); }
.cart-item { background: #fff8ee; border: 1.5px solid var(--light-brown); border-radius: 12px; padding: 12px 14px; margin-bottom: 10px; }
.cart-item.hotel { background: var(--hotel-bg); border-color: var(--hotel-light); }
.cart-item-header { display: flex; align-items: flex-start; justify-content: space-between; margin-bottom: 10px; }
.cart-item-name { font-size: 13px; font-weight: 800; color: var(--text); }
.cart-item-id { font-size: 10px; color: var(--subtext); margin-top: 2px; }
.cart-item-id.hotel { color: var(--hotel); }
.cart-remove { background: none; border: none; color: var(--error); font-size: 16px; cursor: pointer; flex-shrink: 0; }
.cart-item-controls { display: flex; align-items: center; justify-content: space-between; }
.qty-controls { display: flex; align-items: center; gap: 10px; }
.qty-btn { width: 32px; height: 32px; border-radius: 8px; border: 1.5px solid var(--light-brown); background: var(--cream); color: var(--brown); font-size: 18px; font-weight: 700; cursor: pointer; display: flex; align-items: center; justify-content: center; }
.qty-num { font-size: 16px; font-weight: 900; color: var(--text); min-width: 24px; text-align: center; }
.cart-item-price { font-size: 16px; font-weight: 900; color: var(--brown); }
.cart-item-price.hotel { color: var(--hotel); }
.cart-note-field { width: 100%; margin-top: 8px; padding: 8px 12px; border: 1.5px solid var(--border); border-radius: 8px; background: var(--cream); font-size: 12px; color: var(--text); font-family: 'Noto Sans TC', sans-serif; outline: none; resize: none; height: 36px; }
.cart-note-field:focus { border-color: var(--brown); }
.cart-total-row { display: flex; justify-content: space-between; align-items: center; padding: 12px 0; border-top: 2px solid var(--border); margin-top: 4px; }
.cart-total-label { font-size: 14px; font-weight: 800; color: var(--text); }
.cart-total-amount { font-size: 22px; font-weight: 900; color: var(--dark-brown); }
.cart-fields { margin-bottom: 14px; }
.cart-field { margin-bottom: 10px; }
.cart-field-label { font-size: 11px; font-weight: 700; color: var(--subtext); letter-spacing: 1px; margin-bottom: 5px; display: block; }
.cart-input { width: 100%; height: 42px; border: 1.5px solid var(--border); border-radius: 10px; background: #fff8ee; padding: 0 14px; font-size: 14px; color: var(--text); font-family: 'Noto Sans TC', sans-serif; outline: none; }
.cart-input:focus { border-color: var(--brown); }
.checkout-btn { width: 100%; height: 50px; background: var(--brown); color: #fff8ee; border: none; border-radius: 14px; font-size: 15px; font-weight: 900; cursor: pointer; font-family: 'Noto Sans TC', sans-serif; letter-spacing: 2px; margin-top: 8px; }
.cart-empty { text-align: center; padding: 30px; color: var(--subtext); font-size: 14px; }
.cart-hotel-notice { background: var(--hotel-bg); border: 1px solid var(--hotel-light); border-radius: 8px; padding: 10px 12px; margin-bottom: 10px; font-size: 11px; color: var(--hotel); line-height: 1.6; }

/* ── 訂單紀錄 ── */
.order-item { background: #fff8ee; border: 1.5px solid var(--light-brown); border-radius: 12px; padding: 14px 16px; margin-bottom: 10px; }
.order-item.hotel { background: var(--hotel-bg); border-color: var(--hotel-light); }
.order-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 8px; }
.order-date { font-size: 11px; font-weight: 700; color: var(--subtext); margin-bottom: 4px; }
.order-plans { font-size: 13px; font-weight: 800; color: var(--text); }
.order-status { font-size: 10px; font-weight: 700; padding: 3px 10px; border-radius: 10px; flex-shrink: 0; }
.status-pending { background: #fff8ee; color: var(--subtext); border: 1px solid var(--light-brown); }
.status-confirmed { background: #e8f5e0; color: var(--success); border: 1px solid #b0d890; }
.status-hotel-waiting { background: var(--hotel-bg); color: var(--hotel); border: 1px solid var(--hotel-light); }
.status-hotel-filled { background: #e0f0ff; color: #1a5090; border: 1px solid #90c0f0; }
.order-detail { font-size: 12px; color: var(--subtext); line-height: 1.8; }
.order-total { font-size: 16px; font-weight: 900; color: var(--brown); margin-top: 6px; }
.order-total.hotel { color: var(--hotel); }
.fill-data-btn { background: var(--hotel); color: #fff; border: none; border-radius: 8px; padding: 7px 14px; font-size: 12px; font-weight: 700; cursor: pointer; font-family: 'Noto Sans TC', sans-serif; margin-top: 8px; }

/* ── 底部購物車按鈕 ── */
.cart-fab { position: fixed; bottom: 20px; right: 20px; background: var(--brown); color: #fff; width: 56px; height: 56px; border-radius: 50%; border: none; font-size: 24px; cursor: pointer; box-shadow: 0 4px 20px rgba(120,80,30,0.4); display: flex; align-items: center; justify-content: center; z-index: 100; }
.cart-fab-badge { position: absolute; top: -4px; right: -4px; background: #e84030; color: #fff; font-size: 11px; font-weight: 900; width: 20px; height: 20px; border-radius: 50%; display: none; align-items: center; justify-content: center; }

.loading-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 200; align-items: center; justify-content: center; flex-direction: column; gap: 16px; }
.loading-overlay.show { display: flex; }
.loading-spinner { width: 44px; height: 44px; border: 4px solid rgba(255,255,255,0.3); border-top-color: #fff; border-radius: 50%; animation: spin 0.8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.loading-text { color: #fff; font-size: 14px; font-weight: 700; }
.empty-state { text-align: center; padding: 40px 20px; color: var(--subtext); font-size: 14px; }

/* ── 管理員 ── */
.admin-order-item { background: #fff8ee; border: 1.5px solid var(--light-brown); border-radius: 12px; padding: 14px 16px; margin-bottom: 10px; }
.admin-order-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 8px; }
.admin-order-agent { font-size: 11px; font-weight: 800; color: var(--brown); margin-bottom: 2px; }
.admin-order-plan { font-size: 13px; font-weight: 800; color: var(--text); }
.admin-order-detail { font-size: 12px; color: var(--subtext); line-height: 1.8; margin-bottom: 8px; }
.admin-order-total { font-size: 15px; font-weight: 900; color: var(--brown); }
.confirm-btn { background: var(--success); color: #fff; border: none; border-radius: 8px; padding: 6px 14px; font-size: 12px; font-weight: 700; cursor: pointer; font-family: 'Noto Sans TC', sans-serif; }
.plan-manage-item { display: flex; align-items: center; justify-content: space-between; padding: 10px 0; border-bottom: 1px dashed var(--border); font-size: 13px; color: var(--text); }
.plan-manage-item:last-child { border-bottom: none; }
.plan-manage-left { flex: 1; }
.plan-manage-id { font-size: 10px; color: var(--subtext); margin-bottom: 2px; }
.plan-manage-name { font-weight: 700; }
.plan-manage-price { color: var(--brown); font-weight: 800; margin: 0 12px; }
.delist-btn { background: #fce8e6; color: var(--error); border: 1px solid #f0b0a0; border-radius: 8px; padding: 5px 12px; font-size: 11px; font-weight: 700; cursor: pointer; font-family: 'Noto Sans TC', sans-serif; }
.hotel-delist-btn { background: #e8f0ff; color: var(--hotel); border: 1px solid var(--hotel-light); border-radius: 8px; padding: 5px 12px; font-size: 11px; font-weight: 700; cursor: pointer; font-family: 'Noto Sans TC', sans-serif; }

/* ── 加購項目 ── */
.plan-addons { background: #f0f8e8; border: 1.5px solid #90c870; border-radius: 0 0 10px 10px; padding: 12px 14px; margin-top: -4px; }
.plan-addon-title { font-size: 10px; font-weight: 800; color: #4a8a38; letter-spacing: 1px; margin-bottom: 8px; }
.plan-addon-item { display: flex; align-items: center; justify-content: space-between; padding: 6px 0; border-bottom: 1px dashed #c0e0b0; }
.plan-addon-item:last-child { border-bottom: none; padding-bottom: 0; }
.plan-addon-name { font-size: 12px; color: #3a6020; font-weight: 600; }
.plan-addon-price { font-size: 13px; font-weight: 800; color: #4a8a38; }
.add-addon-btn { background: #4a8a38; color: #fff; border: none; border-radius: 6px; padding: 5px 10px; font-size: 11px; font-weight: 700; cursor: pointer; font-family: 'Noto Sans TC', sans-serif; white-space: nowrap; }

/* ── 訂單群組 ── */
.order-group { margin-bottom: 10px; border: 1.5px solid var(--light-brown); border-radius: 12px; overflow: hidden; }
.order-group-header { background: #fff8ee; padding: 12px 16px; display: flex; justify-content: space-between; align-items: center; cursor: pointer; font-size: 13px; color: var(--text); }
.order-group-header:hover { background: #fef5e6; }
.group-arrow { font-size: 11px; color: var(--subtext); transition: transform 0.2s; }
.order-group-body { padding: 10px; background: var(--cream); }
.order-group-body .admin-order-item:last-child { margin-bottom: 0; }

/* ── 補填資料 Modal ── */
.modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.6); z-index: 300; align-items: center; justify-content: center; padding: 20px; }
.modal-overlay.show { display: flex; }
.modal-box { background: var(--cream); border-radius: 20px; padding: 24px 20px; width: 100%; max-width: 420px; max-height: 90vh; overflow-y: auto; }
.modal-title { font-size: 16px; font-weight: 900; color: var(--hotel-dark); margin-bottom: 18px; padding-bottom: 12px; border-bottom: 2px solid var(--hotel-light); display: flex; align-items: center; gap: 8px; }
.modal-field { margin-bottom: 12px; }
.modal-label { font-size: 11px; font-weight: 700; color: var(--subtext); letter-spacing: 1px; margin-bottom: 5px; display: block; }
.modal-input { width: 100%; height: 42px; border: 1.5px solid var(--border); border-radius: 10px; background: #fff8ee; padding: 0 14px; font-size: 14px; color: var(--text); font-family: 'Noto Sans TC', sans-serif; outline: none; }
.modal-input:focus { border-color: var(--hotel); }
.modal-row { display: flex; gap: 10px; }
.modal-row .modal-field { flex: 1; }
.modal-submit-btn { width: 100%; height: 48px; background: var(--hotel); color: #fff; border: none; border-radius: 12px; font-size: 15px; font-weight: 900; cursor: pointer; font-family: 'Noto Sans TC', sans-serif; margin-top: 8px; }
.modal-cancel-btn { width: 100%; height: 40px; background: none; color: var(--subtext); border: 1.5px solid var(--border); border-radius: 12px; font-size: 13px; font-weight: 700; cursor: pointer; font-family: 'Noto Sans TC', sans-serif; margin-top: 8px; }
</style>
</head>
<body>

<!-- 登入頁 -->
<div class="login-page" id="loginPage">
  <div class="login-card">
    <div class="login-logo">
      <div class="login-logo-icon">✈️</div>
      <div class="login-logo-name">FlyLight Travel Lab</div>
      <div class="login-logo-sub">業務下單系統</div>
    </div>
    <div class="login-title">請輸入業務編號登入</div>
    <div class="login-field">
      <label class="login-label">業務編號</label>
      <input class="login-input" id="agentInput" type="text" placeholder="例：A238" maxlength="10">
    </div>
    <button class="login-btn" onclick="login()">登入</button>
    <div class="login-error" id="loginError">業務編號不正確，請重新輸入</div>
  </div>
</div>

<!-- 主頁面 -->
<div class="main-page" id="mainPage">
  <div class="top-bar">
    <div>
      <div class="top-bar-brand">FlyLight Travel Lab</div>
      <div class="top-bar-agent" id="agentLabel"></div>
    </div>
    <div class="top-bar-right">
      <button class="logout-btn" onclick="logout()">登出</button>
    </div>
  </div>

  <div class="tabs" id="mainTabs">
    <div class="tab active" id="tab-order" onclick="switchTab('order')">📦 方案選購</div>
    <div class="tab" id="tab-hotel" onclick="switchTab('hotel')">🏨 飯店訂房</div>
    <div class="tab" id="tab-records" onclick="switchTab('records')">📋 我的訂單</div>
    <div class="tab" id="tab-admin" onclick="switchTab('admin')" style="display:none;">⚙️ 管理</div>
  </div>

  <!-- 方案選購 -->
  <div class="content" id="tabOrder">
    <div class="card">
      <div class="card-title">✈️ 短線方案</div>
      <div class="plan-grid" id="planGridShort"><div class="empty-state">載入中...</div></div>
    </div>
    <div class="card">
      <div class="card-title">🌏 長線方案</div>
      <div class="plan-grid" id="planGridLong"><div class="empty-state">載入中...</div></div>
    </div>
    <div class="card" id="promoSection" style="display:none;">
      <div class="card-title">🔥 促銷 / 特別方案</div>
      <div class="plan-grid" id="planGridPromo"></div>
    </div>
  </div>

  <!-- 飯店訂房 -->
  <div class="content" id="tabHotel" style="display:none;">
    <div class="card" style="border-color:var(--hotel-light);">
      <div class="card-title" style="color:var(--hotel-dark);">🏨 飯店方案</div>
      <div class="plan-grid" id="hotelPlanGrid"><div class="empty-state">載入中...</div></div>
    </div>
  </div>

  <!-- 我的訂單 -->
  <div class="content" id="tabRecords" style="display:none;">
    <div class="card">
      <div class="card-title">📋 我的訂單紀錄</div>
      <div id="orderList"><div class="empty-state">載入中...</div></div>
    </div>
  </div>

  <!-- 管理員頁面 -->
  <div class="content" id="tabAdmin" style="display:none;">

    <!-- 所有訂單 -->
    <div class="card">
      <div class="card-title">📋 所有訂單</div>
      <div style="margin-bottom:12px;display:flex;gap:8px;flex-wrap:wrap;">
        <select class="cart-input" id="filterAgent" onchange="loadAllOrders()" style="height:36px;font-size:13px;flex:1;">
          <option value="">全部業務</option>
          <option value="A238">A238</option>
          <option value="S999">S999</option>
          <option value="J168">J168</option>
          <option value="A118">A118</option>

<script>
/* ── 版本號：每次部署都要改這個數字 ── */
var BUILD = '20261008-v2';

const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbwZ_INF8CS_rsn6x98_QPlcJCOLT-K0FU5s9lDpgX2Dj_zcGqJZM-7IiwpG2T60D4tRPA/exec';
const HOTEL_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbx82qP9c24F7ckG-ioO-351-5STq7vARjknMlR5uifcXgikH0rctPivswtAd_f5GPmL/exec';

const AGENTS = {
  'A238': '業務 A238',
  'S999': '業務 S999',
  'J168': '業務 J168',
  'A118': '業務 A118',

  'ADMIN': '管理員（Meiching）',
};

const DEFAULT_PLANS = [
  { id: 'S-EC',    name: '短線經濟艙 × 1人',       price: 5500,  desc: '32個短線航點任選，出發前再選', type: 'short', addons: '', stock: null },
  { id: 'S-BU',    name: '短線商務艙 × 1人',       price: 12500, desc: '32個短線航點任選，出發前再選', type: 'short', addons: '', stock: null },
  { id: 'S-EC4',   name: '短線經濟艙 × 4人組',     price: 20000, desc: '32個短線航點任選，出發前再選', type: 'short', addons: '', stock: null },
  { id: 'S-BU4',   name: '短線商務艙 × 4人組',     price: 48000, desc: '32個短線航點任選，出發前再選', type: 'short', addons: '', stock: null },
  { id: 'L-EU-EC', name: '歐洲線經濟艙 × 1人',     price: 11000, desc: '20個歐洲航點任選，出發前再選', type: 'long',  addons: '', stock: null },
  { id: 'L-EU-BU', name: '歐洲線商務艙 × 1人',     price: 28500, desc: '20個歐洲航點任選，出發前再選', type: 'long',  addons: '', stock: null },
  { id: 'L-OT-EC', name: '非歐洲長線經濟艙 × 1人', price: 9900,  desc: '9個非歐洲航點任選，出發前再選', type: 'long', addons: '', stock: null },
  { id: 'L-OT-BU', name: '非歐洲長線商務艙 × 1人', price: 25000, desc: '9個非歐洲航點任選，出發前再選', type: 'long', addons: '', stock: null },
];

let currentAgent = null;
let cart = [];

// ── 工具：只取日期部分 ──
function dateOnly(str) {
  if (!str) return '';
  var s = String(str);
  // 處理 ISO 格式 "2026-10-08T..." 或台灣格式 "2026/10/8 上午..." 或 "2026/10/8 星期..."
  // 先取空白前的部分
  var part = s.split('T')[0].split(' ')[0];
  // 去掉斜線後面的星期（有些格式是 "2026/10/8星期四"）
  part = part.replace(/[上下午星期一二三四五六日週]+.*$/, '');
  return part.trim();
}

// ── 登入 ──
function login() {
  var id = document.getElementById('agentInput').value.trim().toUpperCase();
  if (AGENTS[id]) {
    currentAgent = { id: id, name: AGENTS[id] };
    localStorage.setItem('flt_agent', JSON.stringify(currentAgent));
    showMain();
  } else {
    document.getElementById('loginError').style.display = 'block';
  }
}

function logout() {
  localStorage.removeItem('flt_agent');
  currentAgent = null;
  cart = [];
  document.getElementById('loginPage').style.display = 'flex';
  document.getElementById('mainPage').style.display = 'none';
  document.getElementById('cartFab').style.display = 'none';
  document.getElementById('agentInput').value = '';
}

function showMain() {
  document.getElementById('loginPage').style.display = 'none';
  document.getElementById('mainPage').style.display = 'block';
  document.getElementById('cartFab').style.display = 'flex';

    document.getElementById('tab-admin').style.display = 'block';
  }

}

// ── 方案載入 ──
async function loadAndRenderPlans() {
  try {
    var res = await fetch(APPS_SCRIPT_URL + '?type=getPlans');
    var data = await res.json();
    if (data.plans && data.plans.length) {
      var plans = data.plans.map(function(p) {
        var stockVal = p['庫存'];
        var stock = (stockVal !== undefined && stockVal !== null && stockVal !== '') ? Number(stockVal) : null;
        var id = String(p['方案編號'] || '');
        return {
          id: id,
          name: String(p['方案名稱'] || ''),
          price: Number(p['單價']) || 0,
          desc: String(p['說明'] || ''),
          addons: String(p['加購項目'] || ''),
          stock: stock,
          type: id.startsWith('S') ? 'short' : id.startsWith('L') ? 'long' : 'promo'
        };
      });
      renderPlans(plans);
    } else {
      renderPlans(DEFAULT_PLANS);
    }
  } catch(e) {
    console.log('載入方案失敗，使用預設方案', e);
    renderPlans(DEFAULT_PLANS);
  }
}

function renderPlans(plans) {
  var short = plans.filter(function(p) { return p.type === 'short'; });
  var long  = plans.filter(function(p) { return p.type === 'long'; });
  var promo = plans.filter(function(p) { return p.type === 'promo'; });
  document.getElementById('planGridShort').innerHTML = short.length ? short.map(planCard).join('') : '<div class="empty-state">目前無短線方案</div>';
  document.getElementById('planGridLong').innerHTML  = long.length  ? long.map(planCard).join('')  : '<div class="empty-state">目前無長線方案</div>';
  var promoSection = document.getElementById('promoSection');
  if (promo.length) {
    promoSection.style.display = 'block';
    document.getElementById('planGridPromo').innerHTML = promo.map(planCard).join('');
  } else {
    promoSection.style.display = 'none';
  }
  window._currentPlans = plans;
}

function planCard(p) {
  var addons = [];
  if (p.addons) {
    p.addons.split(';').forEach(function(a) {
      if (a.indexOf(':') !== -1) {
        var parts = a.split(':');
        addons.push({ name: parts[0].trim(), price: Number(parts[1].trim()) });
      }
    });
  }

  var addonHtml = '';
  if (addons.length) {
    addonHtml = '<div class="plan-addons"><div class="plan-addon-title">➕ 可加購</div>' +
      addons.map(function(a) {
        return '<div class="plan-addon-item">' +
          '<div class="plan-addon-name">' + a.name + '</div>' +
          '<div style="display:flex;align-items:center;gap:8px;">' +
          '<div class="plan-addon-price">$' + a.price.toLocaleString() + '</div>' +
          '<button class="add-addon-btn" onclick="addAddonToCart(\'' + p.id + '\',\'' + a.name + '\',' + a.price + ')">加購</button>' +
          '</div></div>';
      }).join('') + '</div>';
  }

  // 庫存顯示
  var stockHtml = '';
  var isSoldOut = false;
  if (p.stock !== null && p.stock !== undefined) {
    if (p.stock <= 0) {
      stockHtml = '<div class="plan-stock sold-out">已售完</div>';
      isSoldOut = true;
    } else {
      var isLow = p.stock <= 3;
      stockHtml = '<div class="plan-stock ' + (isLow ? 'low' : 'ok') + '">' + p.stock + '</div>';
    }
  }

  return '<div class="plan-card">' +
    '<div class="plan-left">' +
    '<div class="plan-id">' + p.id + '</div>' +
    '<div class="plan-name">' + p.name + '</div>' +
    '<div class="plan-desc">' + p.desc + '</div>' +
    stockHtml +
    '</div>' +
    '<div style="display:flex;flex-direction:column;align-items:flex-end;gap:8px;">' +
    '<div class="plan-price">$' + p.price.toLocaleString() + '</div>' +
    '<button class="add-cart-btn" ' + (isSoldOut ? 'disabled' : 'onclick="addToCart(\'' + p.id + '\')"') + '>' + (isSoldOut ? '已售完' : '加入購物車') + '</button>' +
    '</div>' +
    '</div>' + addonHtml;
}

// ── 飯店方案 ──
async function loadHotelPlans() {
  document.getElementById('hotelPlanGrid').innerHTML = '<div class="empty-state">載入中...</div>';
  try {
    var res = await fetch(APPS_SCRIPT_URL + '?type=getHotelPlans');
    var data = await res.json();
    if (data.plans && data.plans.length) {
      var plans = data.plans.map(function(p) {
        return {
          id:     String(p.id || p['方案ID'] || ''),
          name:   String(p.name || p['方案名稱'] || ''),
          price:  Number(p.price || p['每晚價格']) || 0,
          desc:   String(p.desc || p['說明'] || p['描述'] || ''),
          active: p.active !== false && p['啟用'] !== '停用' && p['狀態'] !== '下架',
        };
      }).filter(function(p) { return p.id && p.active; });
      window._hotelPlans = plans;
      if (plans.length) {
        document.getElementById('hotelPlanGrid').innerHTML = plans.map(hotelPlanCard).join('');
      } else {
        document.getElementById('hotelPlanGrid').innerHTML = '<div class="empty-state">目前無可用飯店方案</div>';
      }
    } else {
      document.getElementById('hotelPlanGrid').innerHTML = '<div class="empty-state">目前無飯店方案，請聯絡管理員新增</div>';
    }
  } catch(e) {
    document.getElementById('hotelPlanGrid').innerHTML = '<div class="empty-state">載入失敗，請稍後再試</div>';
  }
}

function hotelPlanCard(p) {
  return '<div class="hotel-plan-card">' +
    '<div class="plan-left">' +
    '<div class="hotel-plan-id">' + p.id + '</div>' +
    '<div class="hotel-plan-name">' + p.name + '</div>' +
    '<div class="hotel-plan-desc">' + p.desc + '</div>' +
    '</div>' +
    '<div style="display:flex;flex-direction:column;align-items:flex-end;gap:8px;">' +
    '<div class="hotel-plan-price">$' + p.price.toLocaleString() + '<br><span class="hotel-plan-price-sub">/ 晚</span></div>' +
    '<button class="add-hotel-btn" onclick="addHotelToCart(\'' + p.id + '\')">加入購物車</button>' +
    '</div>' +
    '</div>';
}

// ── 購物車 ──
function addAddonToCart(planId, addonName, addonPrice) {
  var addonId = planId + '-' + addonName;
  var existing = cart.find(function(c) { return c.plan.id === addonId; });
  if (existing) {
    existing.qty++;
  } else {
    cart.push({ plan: { id: addonId, name: addonName + '（' + planId + '加購）', price: addonPrice }, qty: 1, note: '', _isHotel: false });
  }
  updateCartBadge();
  var btn = event.target;
  btn.textContent = '✅';
  setTimeout(function() { btn.textContent = '加購'; }, 1000);
}
window.addAddonToCart = addAddonToCart;

function addToCart(planId) {
  var plans = window._currentPlans || DEFAULT_PLANS;
  var plan = plans.find(function(p) { return p.id === planId; });
  if (!plan) return;
  var existing = cart.find(function(c) { return c.plan.id === planId && !c._isHotel; });
  if (existing) {
    existing.qty++;
  } else {
    cart.push({ plan: plan, qty: 1, note: '', _isHotel: false });
  }
  updateCartBadge();
  var btn = event.target;
  btn.textContent = '✅ 已加入';
  setTimeout(function() { btn.textContent = '加入購物車'; }, 1000);
}

function addHotelToCart(planId) {
  var plans = window._hotelPlans || [];
  var plan = plans.find(function(p) { return p.id === planId; });
  if (!plan) return;
  var existing = cart.find(function(c) { return c.plan.id === planId && c._isHotel; });
  if (existing) {
    existing.qty++;
  } else {
    cart.push({ plan: plan, qty: 1, note: '', _isHotel: true });
  }
  updateCartBadge();
  var btn = event.target;
  btn.textContent = '✅ 已加入';
  setTimeout(function() { btn.textContent = '加入購物車'; }, 1000);
}

function updateCartBadge() {
  var total = cart.reduce(function(s, c) { return s + c.qty; }, 0);
  var badge = document.getElementById('cartFabBadge');
  if (total > 0) {
    badge.style.display = 'flex';
    badge.textContent = total;
  } else {
    badge.style.display = 'none';
  }
}

function openCart() {
  renderCart();
  document.getElementById('cartOverlay').classList.add('show');
  document.getElementById('cartPanel').classList.add('show');
}

function closeCart() {
  document.getElementById('cartOverlay').classList.remove('show');
  document.getElementById('cartPanel').classList.remove('show');
}

function renderCart() {
  var el = document.getElementById('cartItems');
  if (!cart.length) {
    el.innerHTML = '<div class="cart-empty">購物車是空的 🛒<br>請先選擇方案加入</div>';
    return;
  }
  var hasHotel = cart.some(function(c) { return c._isHotel; });
  var total = cart.reduce(function(s, c) { return s + c.plan.price * c.qty; }, 0);
  var hotelNotice = hasHotel ? '<div class="cart-hotel-notice">🏨 飯店訂單說明：送出後狀態為「待補資料」，請在一週內至「我的訂單」補填入住資料（入住日期、房型、住客等）。</div>' : '';
  el.innerHTML = hotelNotice + cart.map(function(c, i) {
    return '<div class="cart-item' + (c._isHotel ? ' hotel' : '') + '">' +
      '<div class="cart-item-header">' +
      '<div>' +
      '<div class="cart-item-id' + (c._isHotel ? ' hotel' : '') + '">' + (c._isHotel ? '🏨 ' : '') + c.plan.id + '</div>' +
      '<div class="cart-item-name">' + c.plan.name + '</div>' +
      '</div>' +
      '<button class="cart-remove" onclick="removeFromCart(' + i + ')">🗑</button>' +
      '</div>' +
      '<div class="cart-item-controls">' +
      '<div class="qty-controls">' +
      '<button class="qty-btn" onclick="changeQty(' + i + ', -1)">−</button>' +
      '<div class="qty-num">' + c.qty + '</div>' +
      '<button class="qty-btn" onclick="changeQty(' + i + ', 1)">＋</button>' +
      '</div>' +
      '<div class="cart-item-price' + (c._isHotel ? ' hotel' : '') + '">$' + (c.plan.price * c.qty).toLocaleString() + (c._isHotel ? '<span style="font-size:10px;font-weight:400;"> /晚</span>' : '') + '</div>' +
      '</div>' +
      '<textarea class="cart-note-field" placeholder="' + (c._isHotel ? '備註（選填）' : '此項目備註（選填）') + '" onchange="updateNote(' + i + ', this.value)">' + c.note + '</textarea>' +
      '</div>';
  }).join('') +
  '<div class="cart-total-row"><div class="cart-total-label">合計</div><div class="cart-total-amount">$' + total.toLocaleString() + '</div></div>';
}

function removeFromCart(i) {
  cart.splice(i, 1);
  updateCartBadge();
  renderCart();
}

function changeQty(i, delta) {
  cart[i].qty = Math.max(1, cart[i].qty + delta);
  updateCartBadge();
  renderCart();
}

function updateNote(i, val) {
  cart[i].note = val;
}

// ── 結帳 ──
async function checkout() {
  if (!cart.length) { alert('購物車是空的！'); return; }
  closeCart();
  showLoading('送出訂單中...');

  var clientName = document.getElementById('clientName').value.trim();
  var remarks = document.getElementById('orderRemarks').value.trim();
  var total = cart.reduce(function(s, c) { return s + c.plan.price * c.qty; }, 0);
  var timestamp = new Date().toISOString();

  var flightItems = cart.filter(function(c) { return !c._isHotel; });
  var hotelItems = cart.filter(function(c) { return c._isHotel; });

  for (var i = 0; i < flightItems.length; i++) {
    var item = flightItems[i];
    await fetch(APPS_SCRIPT_URL, {
      method: 'POST', mode: 'no-cors',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        type: 'order', timestamp: timestamp,
        agentId: currentAgent.id, agentName: currentAgent.name,
        planId: item.plan.id, planName: item.plan.name,
        quantity: item.qty, total: item.plan.price * item.qty,
        clientName: clientName, remarks: item.note || remarks,
      })
    });
  }

  for (var j = 0; j < hotelItems.length; j++) {
    var hitem = hotelItems[j];
    await fetch(HOTEL_SCRIPT_URL, {
      method: 'POST', mode: 'no-cors',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        type: 'hotelOrder', timestamp: timestamp,
        agentId: currentAgent.id, agentName: currentAgent.name,
        planId: hitem.plan.id, planName: hitem.plan.name,
        nights: hitem.qty, pricePerNight: hitem.plan.price,
        total: hitem.plan.price * hitem.qty,
        clientName: clientName, remarks: hitem.note || remarks,
      })
    });
  }

  var flightLines = flightItems.map(function(c) {
    return '  ✈️ ' + c.plan.id + ' ' + c.plan.name + ' × ' + c.qty + ' 組 = $' + (c.plan.price * c.qty).toLocaleString() + (c.note ? ' (' + c.note + ')' : '');
  }).join('\n');
  var hotelLines = hotelItems.map(function(c) {
    return '  🏨 ' + c.plan.name + ' × ' + c.qty + ' 晚 = $' + (c.plan.price * c.qty).toLocaleString() + (c.note ? ' (' + c.note + ')' : '');
  }).join('\n');
  var allLines = [flightLines, hotelLines].filter(Boolean).join('\n');
  var msg = '📦 新訂單通知\n━━━━━━━━━━━━━\n🧑‍💼 業務：' + currentAgent.id + '\n\n' + allLines +
    '\n\n💰 訂單總金額：$' + total.toLocaleString() +
    (clientName ? '\n👤 客戶：' + clientName : '') +
    (remarks ? '\n📝 備註：' + remarks : '') +
    (hotelItems.length ? '\n\n⚠️ 飯店訂單待補入住資料' : '');

  await fetch(NOTIFY_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ type: 'order', message: msg })
  });

  hideLoading();
  var hotelMsg = hotelItems.length ? '\n\n🏨 飯店訂單已送出，請至「我的訂單」補填入住資料' : '';
  alert('✅ 訂單送出成功！\n\n總金額：$' + total.toLocaleString() + hotelMsg);

  cart = [];
  document.getElementById('clientName').value = '';
  document.getElementById('orderRemarks').value = '';
  updateCartBadge();
}

// ── 我的訂單 ──
async function loadOrders() {
  document.getElementById('orderList').innerHTML = '<div class="empty-state">載入中...</div>';
  try {
    var res = await fetch(APPS_SCRIPT_URL + '?type=getOrders&agentId=' + currentAgent.id);
    var data = await res.json();
    var flightOrders = (data.orders || []).map(function(o) { return Object.assign({}, o, { _type: 'flight' }); });

    var hotelOrders = [];
    try {
      var hRes = await fetch(HOTEL_SCRIPT_URL + '?type=getHotelOrders&agentId=' + currentAgent.id);
      var hData = await hRes.json();
      hotelOrders = (hData.orders || []).map(function(o) { return Object.assign({}, o, { _type: 'hotel' }); });
    } catch(e) {}

    var allOrders = flightOrders.concat(hotelOrders).sort(function(a, b) {
      var ta = a['時間'] || a.timestamp || '';
      var tb = b['時間'] || b.timestamp || '';
      return tb.localeCompare(ta);
    });

    if (!allOrders.length) {
      document.getElementById('orderList').innerHTML = '<div class="empty-state">還沒有訂單紀錄 📦</div>';
      return;
    }

    document.getElementById('orderList').innerHTML = allOrders.map(function(o) {
      if (o._type === 'hotel') {
        var status = o.status || '待補資料';
        var statusClass = status === '資料已填' ? 'status-hotel-filled' : 'status-hotel-waiting';
        var fillBtn = status !== '資料已填' ? '<button class="fill-data-btn" onclick="openFillModal(' + o.row + ', \'' + escHtml(o.planName || '') + '\')">✏️ 補填資料</button>' : '';
        return '<div class="order-item hotel">' +
          '<div class="order-header"><div>' +
          '<div class="order-date">🏨 ' + dateOnly(o.timestamp) + '</div>' +
          '<div class="order-plans">' + escHtml(o.planName || '') + '</div>' +
          '</div><div class="order-status ' + statusClass + '">' + status + '</div></div>' +
          '<div class="order-detail">🌙 ' + (o.nights || 0) + '晚' +
          (o.clientName ? ' · 👤 ' + escHtml(o.clientName) : '') +
          (o.remarks ? ' · 📝 ' + escHtml(o.remarks) : '') +
          (o.checkIn ? '<br>📅 入住：' + o.checkIn + ' ～ ' + o.checkOut : '') +
          (o.guestName ? '<br>🧑 住客：' + escHtml(o.guestName) + ' ' + (o.guestPhone || '') : '') +
          '</div>' +
          '<div class="order-total hotel">$' + Number(o.total || 0).toLocaleString() + '</div>' +
          fillBtn + '</div>';
      } else {
        var st = o['狀態'] || '待確認';
        return '<div class="order-item">' +
          '<div class="order-header"><div>' +
          '<div class="order-date">' + dateOnly(o['時間']) + '</div>' +
          '<div class="order-plans">' + (o['方案名稱'] || '') + '</div>' +
          '</div><div class="order-status status-' + (st === '已確認' ? 'confirmed' : 'pending') + '">' + st + '</div></div>' +
          '<div class="order-detail">🔢 ' + (o['組數'] || '') + '組' +
          (o['客戶姓名'] ? ' · 👤 ' + o['客戶姓名'] : '') +
          (o['備註'] ? ' · 📝 ' + o['備註'] : '') +
          '</div>' +
          '<div class="order-total">$' + Number(o['總金額'] || 0).toLocaleString() + '</div>' +
          '</div>';
      }
    }).join('');
  } catch(e) {
    document.getElementById('orderList').innerHTML = '<div class="empty-state">載入失敗，請稍後再試</div>';
  }
}

function escHtml(str) {
  return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// ── 補填資料 ──
function openFillModal(row, planName) {
  document.getElementById('fillRow').value = row;
  document.getElementById('fillPlanName').value = planName;
  document.getElementById('fillCheckIn').value = '';
  document.getElementById('fillCheckOut').value = '';
  document.getElementById('fillRoomType').value = '';
  document.getElementById('fillAdults').value = '2';
  document.getElementById('fillChildren').value = '0';
  document.getElementById('fillGuestName').value = '';
  document.getElementById('fillGuestPhone').value = '';
  document.getElementById('fillDataModal').classList.add('show');
}

function closeFillModal() {
  document.getElementById('fillDataModal').classList.remove('show');
}

async function submitFillData() {
  var row = Number(document.getElementById('fillRow').value);
  var checkIn = document.getElementById('fillCheckIn').value;
  var checkOut = document.getElementById('fillCheckOut').value;
  var roomType = document.getElementById('fillRoomType').value.trim();
  var adults = Number(document.getElementById('fillAdults').value) || 0;
  var children = Number(document.getElementById('fillChildren').value) || 0;
  var guestName = document.getElementById('fillGuestName').value.trim();
  var guestPhone = document.getElementById('fillGuestPhone').value.trim();

  if (!checkIn || !checkOut) { alert('請填寫入住日期和退房日期'); return; }
  if (!guestName) { alert('請填寫住客姓名'); return; }

  closeFillModal();
  showLoading('送出資料中...');

  try {
    await fetch(HOTEL_SCRIPT_URL, {
      method: 'POST', mode: 'no-cors',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ type: 'fillHotelData', row: row, checkIn: checkIn, checkOut: checkOut, roomType: roomType, adults: adults, children: children, guestName: guestName, guestPhone: guestPhone })
    });
    hideLoading();
    alert('✅ 資料補填成功！');
    loadOrders();
  } catch(e) {
    hideLoading();
    alert('送出失敗，請稍後再試');
  }
}

// ── Tab ──
function switchTab(tab) {
  document.getElementById('tabOrder').style.display = tab === 'order' ? 'block' : 'none';
  document.getElementById('tabHotel').style.display = tab === 'hotel' ? 'block' : 'none';
  document.getElementById('tabRecords').style.display = tab === 'records' ? 'block' : 'none';
  document.getElementById('tabAdmin').style.display = tab === 'admin' ? 'block' : 'none';
  document.getElementById('tab-order').classList.toggle('active', tab === 'order');
  document.getElementById('tab-hotel').classList.toggle('active', tab === 'hotel');
  document.getElementById('tab-records').classList.toggle('active', tab === 'records');
  document.getElementById('tab-admin').classList.toggle('active', tab === 'admin');
  if (tab === 'hotel') loadHotelPlans();
  if (tab === 'records') loadOrders();
  if (tab === 'admin') { loadAllOrders(); loadAdminPlans(); loadAdminHotelPlans(); }
}

// ── 管理員：所有訂單 ──
async function loadAllOrders() {
  document.getElementById('allOrderList').innerHTML = '<div class="empty-state">載入中...</div>';
  var agentFilter = document.getElementById('filterAgent').value;
  var statusFilter = document.getElementById('filterStatus').value;
  try {
    var res = await fetch(APPS_SCRIPT_URL + '?type=getAllOrders');
    var data = await res.json();
    var orders = (data.orders || []).reverse();
    if (agentFilter) orders = orders.filter(function(o) { return o['業務編號'] === agentFilter; });
    if (statusFilter) orders = orders.filter(function(o) { return (o['狀態'] || '待確認') === statusFilter; });
    if (!orders.length) {
      document.getElementById('allOrderList').innerHTML = '<div class="empty-state">沒有訂單紀錄</div>';
      return;
    }

    // 依日期分組
    var groups = {};
    orders.forEach(function(o) {
      var d = dateOnly(o['時間']) || '未知日期';
      if (!groups[d]) groups[d] = [];
      groups[d].push(o);
    });

    function makeId(date) { return date.replace(/[\/\-:\s]/g, '_'); }

    document.getElementById('allOrderList').innerHTML = Object.entries(groups).map(function(entry) {
      var date = entry[0];
      var items = entry[1];
      var id = makeId(date);
      return '<div class="order-group">' +
        '<div class="order-group-header" onclick="toggleGroup(\'' + id + '\')">' +
        '<div style="display:flex;align-items:center;gap:8px;">' +
        '<span class="group-arrow" id="arrow-' + id + '">▼</span>' +
        '<strong>' + date + '</strong>' +
        '<span style="font-size:11px;color:var(--subtext);">' + items.length + ' 筆</span>' +
        '</div>' +
        '<div style="font-size:13px;font-weight:800;color:var(--brown);">$' + items.reduce(function(s, o) { return s + Number(o['總金額'] || 0); }, 0).toLocaleString() + '</div>' +
        '</div>' +
        '<div class="order-group-body" id="group-' + id + '">' +
        items.map(function(o) {
          return '<div class="admin-order-item">' +
            '<div class="admin-order-header"><div>' +
            '<div class="admin-order-agent">業務：' + (o['業務編號'] || '') + '</div>' +
            '<div class="admin-order-plan">' + (o['方案名稱'] || '') + '</div>' +
            '</div>' +
            '<div style="display:flex;flex-direction:column;align-items:flex-end;gap:6px;">' +
            '<div class="order-status status-' + (o['狀態'] === '已確認' ? 'confirmed' : 'pending') + '">' + (o['狀態'] || '待確認') + '</div>' +
            (o['狀態'] !== '已確認' ? '<button class="confirm-btn" onclick="confirmOrder(' + o['_row'] + ')">✅ 確認</button>' : '') +
            '</div></div>' +
            '<div class="admin-order-detail">🔢 ' + (o['組數'] || '') + '組' +
            (o['客戶姓名'] ? ' · 👤 ' + o['客戶姓名'] : '') +
            (o['備註'] ? ' · 📝 ' + o['備註'] : '') +
            '</div>' +
            '<div class="admin-order-total">$' + Number(o['總金額'] || 0).toLocaleString() + '</div>' +
            '</div>';
        }).join('') +
        '</div></div>';
    }).join('');
  } catch(e) {
    document.getElementById('allOrderList').innerHTML = '<div class="empty-state">載入失敗</div>';
  }
}

window.toggleGroup = function(id) {
  var body = document.getElementById('group-' + id);
  var arrow = document.getElementById('arrow-' + id);
  if (body.style.display === 'none') {
    body.style.display = 'block';
    arrow.textContent = '▼';
  } else {
    body.style.display = 'none';
    arrow.textContent = '▶';
  }
};

// ── 確認訂單 ──
async function confirmOrder(row) {
  showLoading('確認訂單中...');
  try {
    await fetch(APPS_SCRIPT_URL, {
      method: 'POST', mode: 'no-cors',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ type: 'confirmOrder', row: row })
    });
    hideLoading();
    loadAllOrders();
  } catch(e) {
    hideLoading();
    alert('確認失敗，請稍後再試');
  }
}

// ── 管理員：方案管理 ──
async function loadAdminPlans() {
  document.getElementById('adminPlanList').innerHTML = '<div class="empty-state">載入中...</div>';
  try {
    var res = await fetch(APPS_SCRIPT_URL + '?type=getAllPlans');
    var data = await res.json();
    var plans = data.plans || [];
    if (!plans.length) { document.getElementById('adminPlanList').innerHTML = '<div class="empty-state">沒有方案</div>'; return; }
    document.getElementById('adminPlanList').innerHTML = plans.map(function(p) {
      return '<div class="plan-manage-item">' +
        '<div class="plan-manage-left">' +
        '<div class="plan-manage-id">' + p['方案編號'] + '</div>' +
        '<div class="plan-manage-name">' + p['方案名稱'] + '</div>' +
        '</div>' +
        '<div class="plan-manage-price">$' + Number(p['單價']).toLocaleString() + '</div>' +
        '<button class="delist-btn" onclick="togglePlan(\'' + p['方案編號'] + '\', \'' + p['狀態'] + '\')">' + (p['狀態'] === '上架' ? '下架' : '上架') + '</button>' +
        '</div>';
    }).join('');
  } catch(e) {
    document.getElementById('adminPlanList').innerHTML = '<div class="empty-state">載入失敗</div>';
  }
}

// ── 管理員：飯店方案管理 ──
async function loadAdminHotelPlans() {
  document.getElementById('adminHotelPlanList').innerHTML = '<div class="empty-state">載入中...</div>';
  try {
    var res = await fetch(APPS_SCRIPT_URL + '?type=getHotelPlans');
    var data = await res.json();
    var plans = data.plans || [];
    if (!plans.length) { document.getElementById('adminHotelPlanList').innerHTML = '<div class="empty-state">沒有飯店方案</div>'; return; }
    document.getElementById('adminHotelPlanList').innerHTML = plans.map(function(p) {
      var id = p.id || p['方案ID'] || '';
      var name = p.name || p['方案名稱'] || '';
      var price = Number(p.price || p['每晚價格']) || 0;
      var active = p.active !== false && p['啟用'] !== '停用' && p['狀態'] !== '下架';
      return '<div class="plan-manage-item">' +
        '<div class="plan-manage-left">' +
        '<div class="plan-manage-id" style="color:var(--hotel);">' + id + '</div>' +
        '<div class="plan-manage-name">' + name + '</div>' +
        '</div>' +
        '<div class="plan-manage-price" style="color:var(--hotel);">$' + price.toLocaleString() + '/晚</div>' +
        '<button class="hotel-delist-btn" onclick="toggleHotelPlan(\'' + id + '\')">' + (active ? '下架' : '上架') + '</button>' +
        '</div>';
    }).join('');
  } catch(e) {
    document.getElementById('adminHotelPlanList').innerHTML = '<div class="empty-state">載入失敗</div>';
  }
}

// ── 新增方案 ──
async function addNewPlan() {
  var id = document.getElementById('newPlanId').value.trim();
  var name = document.getElementById('newPlanName').value.trim();
  var price = document.getElementById('newPlanPrice').value.trim();
  var desc = document.getElementById('newPlanDesc').value.trim();
  if (!id || !name || !price) { alert('請填寫方案編號、名稱和單價！'); return; }
  showLoading('新增方案中...');
  try {
    await fetch(APPS_SCRIPT_URL, {
      method: 'POST', mode: 'no-cors',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ type: 'addPlan', id: id, name: name, price: Number(price), desc: desc })
    });
    hideLoading();
    document.getElementById('newPlanId').value = '';
    document.getElementById('newPlanName').value = '';
    document.getElementById('newPlanPrice').value = '';
    document.getElementById('newPlanDesc').value = '';
    alert('✅ 方案新增成功！');
    loadAdminPlans();
    loadAndRenderPlans();
  } catch(e) {
    hideLoading();
    alert('新增失敗，請稍後再試');
  }
}

// ── 上架/下架方案 ──
async function togglePlan(planId, currentStatus) {
  var newStatus = currentStatus === '上架' ? '下架' : '上架';
  showLoading('更新中...');
  try {
    await fetch(APPS_SCRIPT_URL, {
      method: 'POST', mode: 'no-cors',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ type: 'togglePlan', planId: planId, status: newStatus })
    });
    hideLoading();
    loadAdminPlans();
    loadAndRenderPlans();
  } catch(e) {

    alert('更新失敗，請稍後再試');

}
